name: project2-runtime-qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_VERSION: 0.33.3

    steps:
      - name: Checkout Project 2
        uses: actions/checkout@v4

      - name: Checkout exact historical Project 1 benchmark code
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime external
          git clone --quiet https://github.com/todkarsant/Enterprise-Analytics-Copilot.git external/Enterprise-Analytics-Copilot
          git -C external/Enterprise-Analytics-Copilot checkout --quiet 1765680283df63232018bf7b827d1576c81c3a61
          git -C external/Enterprise-Analytics-Copilot rev-parse HEAD | tee artifacts/runtime/project1_benchmark_commit.txt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workflow dependencies and zstd
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Record source provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime
          git rev-parse HEAD | tee artifacts/runtime/project2_commit.txt
          python --version | tee artifacts/runtime/python_version.txt

      - name: Download pinned Ollama 0.33.3 archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o artifacts/runtime/ollama-linux-amd64-0.33.3.tar.zst "$url"
          sha256sum artifacts/runtime/ollama-linux-amd64-0.33.3.tar.zst | tee artifacts/runtime/ollama_archive_sha256.txt
          zstd -t artifacts/runtime/ollama-linux-amd64-0.33.3.tar.zst

      - name: Install pinned Ollama binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ollama-0.33.3"
          tar --use-compress-program=unzstd -xf artifacts/runtime/ollama-linux-amd64-0.33.3.tar.zst -C "$HOME/ollama-0.33.3"
          "$HOME/ollama-0.33.3/bin/ollama" --version
          sha256sum "$HOME/ollama-0.33.3/bin/ollama" | tee artifacts/runtime/ollama_binary_sha256.txt
          echo "$HOME/ollama-0.33.3/bin" >> "$GITHUB_PATH"

      - name: Start pinned Ollama server
        shell: bash
        run: |
          set -euo pipefail
          nohup "$HOME/ollama-0.33.3/bin/ollama" serve > artifacts/runtime/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_BASE_URL/api/version" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$OLLAMA_BASE_URL/api/version" | tee artifacts/runtime/ollama_api_version.json
          test "$(curl -fsS "$OLLAMA_BASE_URL/api/version" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$OLLAMA_VERSION"

      - name: Pull and fingerprint model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$OLLAMA_MODEL"
          ollama list | tee artifacts/runtime/ollama_list.txt
          curl -fsS "$OLLAMA_BASE_URL/api/tags" | tee artifacts/runtime/ollama_tags.json
          curl -fsS "$OLLAMA_BASE_URL/api/show" -H "Content-Type: application/json" -d '{"name":"llama3.2:1b"}' | tee artifacts/runtime/ollama_show.json

      - name: Exact historical provider smoke test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot" python - <<'PY'
          import os, json
          from app.services.llm import OllamaProvider
          provider = OllamaProvider(os.environ["OLLAMA_BASE_URL"], os.environ["OLLAMA_MODEL"])
          result = provider.generate_sql(
              "How many singers do we have?",
              "CREATE TABLE singer (Singer_ID INTEGER, Name TEXT);",
          )
          print(json.dumps({
              "status": "PASS",
              "model": result.model,
              "input_tokens": result.input_tokens,
              "output_tokens": result.output_tokens,
              "generated_sql": result.text,
          }, indent=2))
          PY

      - name: Upload runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project2-runtime-qualification
          path: artifacts/runtime/
          retention-days: 90
