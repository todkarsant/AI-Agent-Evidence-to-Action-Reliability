name: p2-c1-4-runtime3-sequential-qualification
# CI synchronization marker: normalized Spider DB layout for film_rank smoke

on:
  push:
    branches: [main]
    paths:
      - "runtime3_ollama.py"
      - "research/cohort/**"
      - "research/tests/**"
      - ".github/workflows/p2-c1-4-runtime3-sequential-qualification.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "runtime3_ollama.py"
      - "research/cohort/**"
      - "research/tests/**"
      - ".github/workflows/p2-c1-4-runtime3-sequential-qualification.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT1_COMMIT: 7c1864a5619af7118c690f8de72eab57dc0cdc93
  SPIDER_COMMIT: b7b5b8c890cd30e35427348bb9eb8c6d1350ca7c
  SPIDER_ARCHIVE_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
  PILOT_MANIFEST_SHA256: 079b3e4ea3b89e44f28a7c35a68d3aa23eda0e584cfe5a599a398b571b4eac80
  OLLAMA_VERSION: 0.33.3
  OLLAMA_MODEL: llama3.2:1b
  P2_C1_4_PROTOCOL_FROZEN: P2-C1.4-CONFIRMATORY-V1-RUNTIME3-2026-09-21
  RUNTIME3_OLLAMA_CONNECT_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_READ_TIMEOUT_SECONDS: 600
  RUNTIME3_OLLAMA_WRITE_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_POOL_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_MAX_ATTEMPTS: 2
  RUNTIME3_OLLAMA_RETRY_BACKOFF_SECONDS: 2
  RUNTIME3_OLLAMA_MAX_OUTPUT_TOKENS: 4096
  RUNTIME3_OLLAMA_RETRY_OUTPUT_TOKENS: 8192
  RUNTIME3_OLLAMA_CONTEXT_LENGTH: 16384

jobs:
  smoke:
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Project 1 and Spider
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/todkarsant/Enterprise-Analytics-Copilot.git external/Enterprise-Analytics-Copilot
          git -C external/Enterprise-Analytics-Copilot checkout --quiet "$PROJECT1_COMMIT"
          test "$(git -C external/Enterprise-Analytics-Copilot rev-parse HEAD)" = "$PROJECT1_COMMIT"
          git clone --quiet https://github.com/taoyds/spider.git external/spider
          git -C external/spider checkout --quiet "$SPIDER_COMMIT"
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd unzip
          python -m pip install --upgrade pip
          python -m pip install -r external/Enterprise-Analytics-Copilot/requirements.txt
          python -m pip install "nltk==3.9.4" jsonschema
          mkdir -p "$HOME/nltk_data"
          python -m nltk.downloader -d "$HOME/nltk_data" punkt_tab
          echo "NLTK_DATA=$HOME/nltk_data" >> "$GITHUB_ENV"
      - name: Run Runtime3 transport unit tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot:$GITHUB_WORKSPACE" python -m pytest -q research/tests/test_runtime3_ollama_transport.py
      - name: Download and verify Spider source
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o data/spider_data.zip "https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip?download=true"
          test "$(sha256sum data/spider_data.zip | cut -d' ' -f1)" = "$SPIDER_ARCHIVE_SHA256"
          unzip -q data/spider_data.zip -d data/spider_unpacked
          find data/spider_unpacked -name train_spider.json -exec cp {} data/train_spider.json \;
          find data/spider_unpacked -name train_others.json -exec cp {} data/train_others.json \;
          find data/spider_unpacked -name tables.json -exec cp {} data/tables.json \;
          mkdir -p data/database
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("data/spider_unpacked")
          out = Path("data/database")
          candidates = list(root.rglob("*.sqlite")) + list(root.rglob("*.db"))
          assert candidates, "No SQLite databases found in verified Spider archive"
          copied = 0
          for src in candidates:
              db_id = src.parent.name
              if src.stem != db_id:
                  continue
              dest_dir = out / db_id
              dest_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest_dir / src.name)
              copied += 1
          assert (out / "film_rank" / "film_rank.sqlite").exists(), "Verified Spider archive did not expose film_rank/film_rank.sqlite"
          print({"sqlite_candidates": len(candidates), "copied_databases": copied, "film_rank": str(out / "film_rank" / "film_rank.sqlite")})
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("data/train_spider.json").read_text())
          b=json.loads(Path("data/train_others.json").read_text())
          Path("data/confirmatory_questions_source.json").write_text(json.dumps(a+b),encoding="utf-8")
          PY
      - name: Recover frozen pilot and prepare 200-case sequential qualification
        run: |
          set -euo pipefail
          mkdir -p data/manifests
          git clone --quiet --depth 1 https://github.com/todkarsant/AI-Agent-Evidence-to-Action-Reliability.git /tmp/p2-self
          cp /tmp/p2-self/data/manifests/C4_2_3B_PILOT12_CASES.json data/manifests/C4_2_3B_PILOT12_CASES.json
          test "$(sha256sum data/manifests/C4_2_3B_PILOT12_CASES.json | cut -d' ' -f1)" = "$PILOT_MANIFEST_SHA256"
          python research/cohort/prepare_P2_C1_4_confirmatory_manifest.py --train data/train_spider.json data/train_others.json --pilot-manifest data/manifests/C4_2_3B_PILOT12_CASES.json --output data/manifests/P2_C1_4_CONFIRMATORY_MANIFEST.json
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          src=Path("data/manifests/P2_C1_4_CONFIRMATORY_MANIFEST.json")
          m=json.loads(src.read_text())
          assert m["confirmatory"] is True
          cases=m["cases"][:200]
          assert len(cases)==200
          assert cases[0]["decision_id"]=="P2C14-CONF-000001"
          assert cases[-1]["decision_id"]=="P2C14-CONF-000200"
          out=Path("data/manifests/P2_C1_4_SEQUENTIAL_QUALIFICATION_200.json")
          out.write_text(json.dumps({"protocol_version":m["protocol_version"],"confirmatory":True,"qualification":True,"parent_manifest_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),"cases":cases},indent=2,ensure_ascii=False)+"\n")
          print({"qualification_cases":200,"first":cases[0]["decision_id"],"last":cases[-1]["decision_id"]})
          PY

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/ollama-linux-amd64.tar.zst "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          zstd -t /tmp/ollama-linux-amd64.tar.zst
          mkdir -p "$HOME/ollama-$OLLAMA_VERSION"
          tar --use-compress-program=unzstd -xf /tmp/ollama-linux-amd64.tar.zst -C "$HOME/ollama-$OLLAMA_VERSION"
          echo "$HOME/ollama-$OLLAMA_VERSION/bin" >> "$GITHUB_PATH"
      - name: Start and fingerprint Ollama
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup "$HOME/ollama-$OLLAMA_VERSION/bin/ollama" serve > artifacts/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1 && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:11434/api/version | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$OLLAMA_VERSION"
          ollama pull "$OLLAMA_MODEL"
          curl -fsS http://127.0.0.1:11434/api/show -H "Content-Type: application/json" -d '{"name":"llama3.2:1b"}' > artifacts/ollama_show.json
      - name: Run frozen pathological-case preflight (000091)
        env:
          PROJECT1_ROOT: ${{ github.workspace }}/external/Enterprise-Analytics-Copilot
          RUNTIME_MANIFEST_HASH: ${{ github.sha }}
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: llama3.2:1b
        run: |
          set -euo pipefail
          mkdir -p data/manifests artifacts/preflight-000091
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("data/manifests/P2_C1_4_CONFIRMATORY_MANIFEST.json")
          m=json.loads(src.read_text(encoding="utf-8"))
          case=next(c for c in m["cases"] if c["decision_id"]=="P2C14-CONF-000091")
          Path("data/manifests/P2_C1_4_PREFLIGHT_000091.json").write_text(json.dumps({k:v for k,v in m.items() if k != "cases"} | {"cases":[case]}, indent=2, ensure_ascii=False) + "\n")
          print({"preflight_case":case["decision_id"],"db_id":case["db_id"]})
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot:$GITHUB_WORKSPACE" python research/cohort/collect_P2_C1_4_aligned_cohort.py --questions data/confirmatory_questions_source.json --database-dir data/database --manifest data/manifests/P2_C1_4_PREFLIGHT_000091.json --spider-eval-dir external/spider --tables-file data/tables.json --outdir artifacts/preflight-000091 --confirmatory
      - name: Run sequential 200-case qualification
        env:
          PROJECT1_ROOT: ${{ github.workspace }}/external/Enterprise-Analytics-Copilot
          RUNTIME_MANIFEST_HASH: ${{ github.sha }}
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: llama3.2:1b
        run: |
          set -euo pipefail
          mkdir -p artifacts/qualification
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot:$GITHUB_WORKSPACE" python research/cohort/collect_P2_C1_4_aligned_cohort.py --questions data/confirmatory_questions_source.json --database-dir data/database --manifest data/manifests/P2_C1_4_SEQUENTIAL_QUALIFICATION_200.json --spider-eval-dir external/spider --tables-file data/tables.json --outdir artifacts/qualification --confirmatory

      - name: Validate qualification artifact
        run: |
          set -euo pipefail
          python research/cohort/validate_P2_C1_4_aligned_records.py artifacts/qualification/aligned_records.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/qualification/aligned_records.json").read_text())
          assert len(d["records"])==200
          assert d["records"][0]["decision_id"]=="P2C14-CONF-000001"
          assert d["records"][-1]["decision_id"]=="P2C14-CONF-000200"
          print({"qualification_records":200,"status":"PASS"})
          PY

      - name: Upload qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-c1-4-runtime3-sequential-qualification-200
          path: artifacts/
          retention-days: 14
