name: p2-c1-4-runtime3-pathology-recovery-diagnostic
# Candidate diagnostic also captures partial streamed output before a read timeout.
# Regression fixture uses the same detector-positive nested repetition as the unit test.

on:
  # Deliberately self-start once from main when this diagnostic workflow changes.
  # The candidate recovery remains non-confirmatory and isolated.
  push:
    branches: [main]
    paths:
      - ".github/workflows/p2-c1-4-runtime3-pathology-recovery-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT1_COMMIT: 7c1864a5619af7118c690f8de72eab57dc0cdc93
  SPIDER_COMMIT: b7b5b8c890cd30e35427348bb9eb8c6d1350ca7c
  SPIDER_ARCHIVE_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
  PILOT_MANIFEST_SHA256: 079b3e4ea3b89e44f28a7c35a68d3aa23eda0e584cfe5a599a398b571b4eac80
  OLLAMA_VERSION: 0.33.3
  OLLAMA_MODEL: llama3.2:1b
  P2_C1_4_PROTOCOL_FROZEN: P2-C1.4-CONFIRMATORY-V1-RUNTIME3-2026-09-21
  RUNTIME3_OLLAMA_CONNECT_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_READ_TIMEOUT_SECONDS: 120
  RUNTIME3_OLLAMA_WRITE_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_POOL_TIMEOUT_SECONDS: 30
  RUNTIME3_OLLAMA_MAX_ATTEMPTS: 2
  RUNTIME3_OLLAMA_RETRY_BACKOFF_SECONDS: 2
  RUNTIME3_OLLAMA_MAX_OUTPUT_TOKENS: 4096
  RUNTIME3_OLLAMA_RETRY_OUTPUT_TOKENS: 8192
  RUNTIME3_OLLAMA_CONTEXT_LENGTH: 16384

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Project 1 and Spider
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/todkarsant/Enterprise-Analytics-Copilot.git external/Enterprise-Analytics-Copilot
          git -C external/Enterprise-Analytics-Copilot checkout --quiet "$PROJECT1_COMMIT"
          test "$(git -C external/Enterprise-Analytics-Copilot rev-parse HEAD)" = "$PROJECT1_COMMIT"
          git clone --quiet https://github.com/taoyds/spider.git external/spider
          git -C external/spider checkout --quiet "$SPIDER_COMMIT"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd unzip
          python -m pip install --upgrade pip
          python -m pip install -r external/Enterprise-Analytics-Copilot/requirements.txt
          python -m pip install "nltk==3.9.4" jsonschema
          mkdir -p "$HOME/nltk_data"
          python -m nltk.downloader -d "$HOME/nltk_data" punkt_tab
          echo "NLTK_DATA=$HOME/nltk_data" >> "$GITHUB_ENV"

      - name: Run targeted unit tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot:$GITHUB_WORKSPACE"             python -m pytest -q research/tests/test_runtime3_ollama_transport.py

      - name: Download and verify Spider source
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 8 --retry-all-errors --retry-delay 5             -o data/spider_data.zip             "https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip?download=true"
          test "$(sha256sum data/spider_data.zip | cut -d' ' -f1)" = "$SPIDER_ARCHIVE_SHA256"
          unzip -q data/spider_data.zip -d data/spider_unpacked
          find data/spider_unpacked -name train_spider.json -exec cp {} data/train_spider.json \;
          find data/spider_unpacked -name train_others.json -exec cp {} data/train_others.json \;
          find data/spider_unpacked -name tables.json -exec cp {} data/tables.json \;
          mkdir -p data/database
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path("data/spider_unpacked"); out=Path("data/database")
          a=json.loads(Path("data/train_spider.json").read_text())
          b=json.loads(Path("data/train_others.json").read_text())
          Path("data/confirmatory_questions_source.json").write_text(json.dumps(a+b),encoding="utf-8")
          for src in list(root.rglob("*.sqlite"))+list(root.rglob("*.db")):
              db_id=src.parent.name
              if src.stem != db_id: continue
              d=out/db_id; d.mkdir(parents=True,exist_ok=True); shutil.copy2(src,d/src.name)
          assert (out/"film_rank"/"film_rank.sqlite").exists()
          PY

      - name: Build one-case diagnostic manifest
        run: |
          set -euo pipefail
          mkdir -p data/manifests artifacts
          git clone --quiet --depth 1 https://github.com/todkarsant/AI-Agent-Evidence-to-Action-Reliability.git /tmp/p2-self
          cp /tmp/p2-self/data/manifests/C4_2_3B_PILOT12_CASES.json data/manifests/C4_2_3B_PILOT12_CASES.json
          test "$(sha256sum data/manifests/C4_2_3B_PILOT12_CASES.json | cut -d' ' -f1)" = "$PILOT_MANIFEST_SHA256"
          python research/cohort/prepare_P2_C1_4_confirmatory_manifest.py             --train data/train_spider.json data/train_others.json             --pilot-manifest data/manifests/C4_2_3B_PILOT12_CASES.json             --output data/manifests/P2_C1_4_CONFIRMATORY_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("data/manifests/P2_C1_4_CONFIRMATORY_MANIFEST.json")
          m=json.loads(src.read_text())
          case=next(c for c in m["cases"] if c["decision_id"]=="P2C14-CONF-000091")
          m["confirmatory"]=False
          m["diagnostic_scope"]="P2-C1.4 pathological-SQL recovery candidate"
          m["cases"]=[case]
          Path("data/manifests/P2_C1_4_PATHOLOGY_DIAGNOSTIC_000091.json").write_text(
              json.dumps(m,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --retry-delay 5             -o /tmp/ollama-linux-amd64.tar.zst             "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          zstd -t /tmp/ollama-linux-amd64.tar.zst
          mkdir -p "$HOME/ollama-$OLLAMA_VERSION"
          tar --use-compress-program=unzstd -xf /tmp/ollama-linux-amd64.tar.zst -C "$HOME/ollama-$OLLAMA_VERSION"
          echo "$HOME/ollama-$OLLAMA_VERSION/bin" >> "$GITHUB_PATH"

      - name: Start and fingerprint Ollama
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup "$HOME/ollama-$OLLAMA_VERSION/bin/ollama" serve > artifacts/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:11434/api/version | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$OLLAMA_VERSION"
          ollama pull "$OLLAMA_MODEL"
          curl -fsS http://127.0.0.1:11434/api/show             -H "Content-Type: application/json"             -d '{"name":"llama3.2:1b"}' > artifacts/ollama_show.json

      - name: Run candidate recovery on frozen 000091
        env:
          RUNTIME3_ENABLE_PATHOLOGICAL_SQL_REPAIR: "1"
          RUNTIME3_PATHOLOGICAL_REPAIR_OUTPUT_TOKENS: 2048
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot:$GITHUB_WORKSPACE"             LLM_PROVIDER=ollama             OLLAMA_BASE_URL=http://127.0.0.1:11434             OLLAMA_MODEL=llama3.2:1b             PROJECT1_ROOT="$GITHUB_WORKSPACE/external/Enterprise-Analytics-Copilot"             RUNTIME_MANIFEST_HASH="$GITHUB_SHA"             python research/cohort/collect_P2_C1_4_aligned_cohort.py               --questions data/confirmatory_questions_source.json               --database-dir data/database               --manifest data/manifests/P2_C1_4_PATHOLOGY_DIAGNOSTIC_000091.json               --spider-eval-dir external/spider               --tables-file data/tables.json               --outdir artifacts/000091               --non-confirmatory
          rc=$?
          set -e
          echo "$rc" > artifacts/000091/exit_code.txt
          exit "$rc"

      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-c1-4-runtime3-pathology-recovery-000091
          path: artifacts/
          retention-days: 30
