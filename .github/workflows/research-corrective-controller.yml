name: research-corrective-controller

on:
  push:
    paths:
      - ".github/workflows/research-corrective-controller.yml"
      - ".github/scripts/research_corrective_controller.sh"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: research-corrective-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Run autonomous research corrective controller
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/scripts/research_corrective_controller.sh -o /tmp/research_corrective_controller.sh
          bash /tmp/research_corrective_controller.sh
