name: TEMP Runtime3 dispatcher
on:
  push:
    paths:
      - .github/workflows/TEMP_RUNTIME3_DISPATCH.yml
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Runtime3 and record run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run p2-c1-4-confirmatory-acquisition-runtime3.yml --repo "$REPO" --ref main
          sleep 8
          row="$(gh run list --repo "$REPO" --workflow p2-c1-4-confirmatory-acquisition-runtime3.yml --limit 1 --json databaseId,url,status,headSha --jq '.[0]')"
          echo "$row"
          id="$(echo "$row" | jq -r .databaseId)"
          url="$(echo "$row" | jq -r .url)"
          gh issue create --repo "$REPO" --title "P2-C1.4 Runtime3 dispatch recorded $id" --body "Fresh Runtime3 confirmatory acquisition dispatched from current main.

Run ID: $id
Run URL: $url
Scientific protocol unchanged. This issue is infrastructure bookkeeping only."

# trigger dispatch
