name: research-auto-controller
# Research progression: terminal success advances only to predefined next gates.
# Triggered here after packet-generator validation fixes so the controller re-runs the mandatory smoke gate.
# Packet leakage audits are key-aware; substring matches such as cost/correctness are not treated as forbidden fields.
# Controller polling fix: a newly dispatched smoke run must be polled from an empty terminal state.
# Packet generation is now a dependent reusable job behind the smoke gate; no direct workflow-dispatch dependency remains.
# Reusable packet workflow YAML was repaired; re-run the controller against the corrected definition.

on:
  push:
    paths:
      - ".github/workflows/research-auto-controller.yml"
      - ".github/scripts/research_corrective_controller.sh"
  # Controller is dispatch-only during the confirmatory acquisition.
  # This prevents a free-tier hourly scheduler from competing with the locked run.
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  # Hourly controller runs are idempotent; keep only the newest pending controller.
  group: research-auto-controller
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Run autonomous research corrective controller
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/scripts/research_corrective_controller.sh" -o /tmp/research_corrective_controller.sh
          bash /tmp/research_corrective_controller.sh
