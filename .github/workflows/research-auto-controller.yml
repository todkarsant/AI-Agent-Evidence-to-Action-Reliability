name: research-auto-controller
# Research progression: terminal success advances only to predefined next gates.
# Triggered here after packet-generator validation fixes so the controller re-runs the mandatory smoke gate.

on:
  push:
    paths:
      - ".github/workflows/research-auto-controller.yml"
      - ".github/scripts/research_corrective_controller.sh"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: research-auto-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Run autonomous research corrective controller
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/scripts/research_corrective_controller.sh" -o /tmp/research_corrective_controller.sh
          bash /tmp/research_corrective_controller.sh
